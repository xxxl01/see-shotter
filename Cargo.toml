[package]
name = "shotter"
version = "0.1.0"
edition = "2021"

[dependencies]
png = "0.17"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
  "Win32_Foundation", "Win32_Graphics_Gdi",
  "Win32_UI_WindowsAndMessaging", "Win32_System_SystemInformation",
  "Win32_System_Performance", "Win32_UI_HiDpi",
] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
